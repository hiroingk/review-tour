name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Run verification
        run: pnpm run verify

      - name: Resolve npm dist-tag
        id: dist_tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in
            *-alpha.*) TAG=alpha ;;
            *-beta.*) TAG=beta ;;
            *-rc.*) TAG=rc ;;
            *) TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Pack packages
        id: pack
        run: |
          set -euo pipefail
          PACK_DIR="$(mktemp -d)"
          echo "dir=$PACK_DIR" >> "$GITHUB_OUTPUT"
          pnpm pack --pack-destination "$PACK_DIR"
          ls -1 "$PACK_DIR"

      - name: Publish packages
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PACK_DIR="${{ steps.pack.outputs.dir }}"
          DIST_TAG="${{ steps.dist_tag.outputs.tag }}"
          npm publish "$PACK_DIR/review-tour-$VERSION.tgz" --access public --provenance --tag "$DIST_TAG"
